spring:
  application:
    name: issuer-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/secure_wallet
    username: wallet_user
    password: secure_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false
  
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.vita: DEBUG

jwt:
  secret: your-super-secret-key-that-is-at-least-32-characters-long-for-development
  expiration: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
